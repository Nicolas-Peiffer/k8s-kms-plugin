# .github/actions/setup-build-env/action.yml
#
# Prepares the ubuntu runner with everything needed to build, scan, and sign
# k8s-kms-plugin for all target architectures.
#
# Responsibilities (single axis of change: tool versions and build requirements):
#   - Go toolchain (version from go.mod)
#   - LDFLAGS (written to GITHUB_ENV for subsequent steps)
#   - Cross-compilers for linux/arm64 (aarch64) and linux/riscv64
#   - Ko (container image builder)
#   - Cosign (keyless blob and image signing)
#   - Syft (SPDX + CycloneDX SBOM generation)
#   - Trivy (CycloneDX VEX SBOM with vulnerability data)
#
# Pre-condition: the calling job must have checked out the repo before calling
#   this action (LDFLAGS runs `make get-ldflags` which needs the Makefile).
#
# Tool versions: update here when new releases are available.
#   COSIGN_VERSION=3.0.6  SYFT_VERSION=1.45.1  TRIVY_VERSION=0.71.0

name: Setup build environment
description: >
  Installs the complete build toolchain: Go (from go.mod), cross-compilers for
  aarch64 and riscv64, ko, cosign, syft, and trivy. Writes LDFLAGS to GITHUB_ENV.
  Must be called after actions/checkout.

# No inputs: all versions are constants so Dependabot can track them in this
# single file rather than hunting through multiple callers.

runs:
  using: composite
  steps:

    # -- Go -------------------------------------------------------------------
    - name: Set up Go
      # actions/setup-go v6.4.0
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-version-file: go.mod
        cache: true

    # -- LDFLAGS --------------------------------------------------------------
    # Written to GITHUB_ENV so any subsequent step in the same job can read it
    # as ${{ env.LDFLAGS }} without passing it around as a step output.
    - name: Compute LDFLAGS
      shell: bash
      run: echo "LDFLAGS=$(make get-ldflags)" >> "$GITHUB_ENV"

    # -- Cross-compilers ------------------------------------------------------
    # linux/amd64 uses the native gcc already present on ubuntu-latest.
    # linux/arm64 (aarch64) and linux/riscv64 need Debian cross-compiler packages.
    - name: Install cross-compilers
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          gcc-riscv64-linux-gnu \
          g++-riscv64-linux-gnu \
          libc6-dev-arm64-cross \
          libc6-dev-riscv64-cross

    - name: Verify cross-compiler toolchains
      shell: bash
      run: |
        aarch64-linux-gnu-gcc --version
        riscv64-linux-gnu-gcc --version

    # -- Ko -------------------------------------------------------------------
    # Container image builder invoked by the goreleaser kos block.
    - name: Set up Ko
      # ko-build/setup-ko v0.9
      uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d

    # -- Cosign ---------------------------------------------------------------
    # Keyless mode is the default. Signing is fully non-interactive:
    # the GitHub OIDC token is used automatically when id-token:write is granted.
    #
    # cosign-release is pinned deliberately. Left unpinned, the installer tracks
    # its own default, which is how the v3 sign-blob change (--output-signature /
    # --output-certificate replaced by --bundle) reached this pipeline unannounced
    # and broke the release. Bump this in step with the `signs` block in
    # .goreleaser.yml.
    - name: Install cosign
      # sigstore/cosign-installer v4.1.2
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v3.0.6

    # -- Syft -----------------------------------------------------------------
    # Generates SPDX-JSON and CycloneDX-JSON SBOMs, invoked by goreleaser.
    #
    # Installed through the official action rather than `curl | sudo sh`. Both
    # upstream installer scripts are served from a mutable `main` branch, so a
    # compromise of either repository — or of raw.githubusercontent.com serving
    # it — would run as root in the release job. That job holds contents:write,
    # packages:write, id-token:write and attestations:write, so it can publish
    # releases, push to GHCR and mint cosign keyless signatures and SLSA
    # provenance: the blast radius is every artefact this project ships.
    # Pinning the tool version does not help, because the script executes before
    # the version argument is ever read.
    #
    # The action is pinned by commit SHA like every other action here, so
    # Dependabot tracks it and the version comment stays reviewable. It places
    # syft on PATH, which is what goreleaser's `cmd: syft` resolves.
    - name: Install Syft
      # anchore/sbom-action v0.24.2
      uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
      with:
        syft-version: v1.45.1

    # -- Trivy ----------------------------------------------------------------
    # Generates CycloneDX VEX SBOMs with live vulnerability data, invoked by goreleaser.
    #
    # Pinned by commit SHA for the reason given above Syft. setup-trivy runs the
    # same contrib/install.sh this step used to curl, but checks it out at a
    # pinned commit first and appends the binary directory to $GITHUB_PATH, so
    # goreleaser's `cmd: trivy` still resolves.
    - name: Install Trivy
      # aquasecurity/setup-trivy v0.3.1
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      with:
        version: v0.71.0
